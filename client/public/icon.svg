<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="512" y2="512" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0f2027"/>
      <stop offset="50%" stop-color="#203a43"/>
      <stop offset="100%" stop-color="#2c5364"/>
    </linearGradient>
    <linearGradient id="logo" x1="120" y1="120" x2="390" y2="390" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#6366f1"/>
      <stop offset="100%" stop-color="#06b6d4"/>
    </linearGradient>
  </defs>

  <!-- Background fills the whole square (required for maskable safe zone) -->
  <rect width="512" height="512" fill="url(#bg)"/>

  <!-- Outer dashed orbit ring -->
  <circle cx="256" cy="256" r="136" stroke="url(#logo)" stroke-width="14" stroke-dasharray="28 14" opacity="0.5" fill="none"/>
  <!-- Inner orbit ring -->
  <circle cx="256" cy="256" r="86" stroke="url(#logo)" stroke-width="11" fill="none"/>
  <!-- Center core -->
  <circle cx="256" cy="256" r="29" fill="url(#logo)"/>
  <!-- Orbiting planet -->
  <circle cx="256" cy="170" r="18" fill="#ffffff" opacity="0.92"/>
</svg>
